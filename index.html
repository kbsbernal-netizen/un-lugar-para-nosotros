<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un lugar para nosotros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500..900&family=Instrument+Sans:ital,wght@0,400..600;1,400..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concepto: créditos de cine en una sala oscura. Negro con luz morada, títulos condensados
   como créditos, datos técnicos en letra de máquina (como el borde de la película) y
   cartas en papel blanco, como una copia fotográfica. Una columna de lectura (≈62ch).
   Aspecto único y oscuro por decisión: no cambia con el tema del sistema. */
:root {
  color-scheme: dark;
  --negro: #0e0b12;
  --negro-2: #17121d;
  --negro-3: #221b2b;
  --morado-hondo: #4b2a8a;
  --morado: #7c4ddb;
  --blanco: #f5f3f7;
  --blanco-suave: #bdb4c9;
  --lavanda: #c3a8ff;
  --violeta: #a888ff;
  --papel: #f7f6f9;
  --papel-borde: #dcd6e4;
  --tinta: #15111a;
  --tinta-suave: #574f63;
  --ph-osc: #d2bfff;
  --ph-osc-fondo: rgba(195, 168, 255, .12);
  --ph-papel: #5b36a8;
  --ph-papel-fondo: rgba(91, 54, 168, .08);
  --linea: rgba(245, 243, 247, .14);

  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --f-lectura: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-ui: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-dato: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --t-xs: .8rem; --t-s: .9rem; --t-m: 1.0625rem; --t-l: 1.25rem; --t-xl: 1.75rem; --t-xxl: clamp(2.2rem, 7vw, 3.6rem);
  --radio: 14px;
  --ratio: 3 / 2;   /* formato de la foto del juego */
  --lectura: 62ch;
}

html { scroll-behavior: smooth; }
body {
  background: var(--negro);
  background-image:
    radial-gradient(1100px 520px at 50% -180px, rgba(124, 77, 219, .45), transparent 70%),
    radial-gradient(700px 400px at 100% 100%, rgba(75, 42, 138, .25), transparent 70%);
  background-attachment: fixed;
  color: var(--blanco);
  font-family: var(--f-ui);
  font-size: var(--t-m);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--negro); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--violeta); outline-offset: 3px; border-radius: 6px; }
[data-foco]:focus { outline: none; }
[data-foco]:focus-visible { outline: 2px solid var(--violeta); }

h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.05; letter-spacing: .01em; }
h1, h2 { text-transform: uppercase; font-weight: 800; }
h2 { font-size: clamp(2rem, 6vw, 2.6rem); }
h3 { font-size: var(--t-l); }
p { margin: 0; }

.marco { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ancho { max-width: 1040px; margin: 0 auto; }
.lectura { max-width: var(--lectura); margin-left: auto; margin-right: auto; }

/* Marcadores editables: visibles a propósito para que nada parezca un dato real */
.ph {
  color: var(--ph-osc); background: var(--ph-osc-fondo);
  border-bottom: 1px dashed currentColor; border-radius: 3px;
  padding: 0 .2em; font-style: normal; font-family: var(--f-ui); font-size: .92em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.papel .ph { color: var(--ph-papel); background: var(--ph-papel-fondo); }
.pordefinir { color: var(--lavanda); }
.papel .pordefinir { color: var(--ph-papel); }

/* Botones */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 46px; padding: .6em 1.25em; border-radius: 999px;
  font: 500 var(--t-s)/1.2 var(--f-ui); letter-spacing: .02em;
  border: 1px solid var(--linea); background: transparent; color: var(--blanco);
  cursor: pointer; text-decoration: none; transition: background .2s, border-color .2s, transform .2s;
}
.btn:hover { border-color: var(--lavanda); }
.btn:active { transform: scale(.98); }
.btn-principal { background: var(--blanco); color: var(--tinta); border-color: var(--blanco); }
.btn-principal:hover { background: #ffffff; }
.btn-suave { background: var(--negro-3); }
.enlace {
  background: none; border: 0; padding: .5em .2em; min-height: 44px; cursor: pointer;
  color: var(--blanco-suave); font: 400 var(--t-s) var(--f-ui);
  text-decoration: underline; text-decoration-color: rgba(189,180,201,.5); text-underline-offset: 4px;
}
.enlace:hover { color: var(--blanco); }
.fila { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Cabecera fija */
.cabecera {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: rgba(14, 11, 18, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--linea);
}
.cabecera-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; }
.marca { font-family: var(--f-display); font-size: 1.1rem; background: none; border: 0; color: var(--blanco); cursor: pointer; padding: 6px 0; min-height: 44px; }
.progreso { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: var(--t-xs); color: var(--blanco-suave); letter-spacing: .04em; }
.progreso-barra { display: flex; gap: 4px; }
.progreso-barra span { width: 18px; height: 4px; border-radius: 2px; background: var(--linea); }
.progreso-barra span.si { background: var(--lavanda); }
.nav-wrap { flex-basis: 100%; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; }
.nav-wrap::-webkit-scrollbar { display: none; }
.nav { display: flex; gap: 6px; list-style: none; margin: 0; padding: 2px 4px 4px; width: max-content; }
.nav button {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--linea); background: transparent; color: var(--blanco);
  font: 500 var(--t-xs)/1 var(--f-ui); letter-spacing: .03em; cursor: pointer; white-space: nowrap;
}
.nav button[aria-current="page"] { background: var(--morado-hondo); border-color: var(--morado); }
.nav button[aria-disabled="true"] { color: rgba(189,180,201,.6); border-style: dashed; cursor: default; }
.nav .ico { font-size: .9em; opacity: .85; }
.aviso-bloqueo { flex-basis: 100%; font-size: var(--t-xs); color: var(--lavanda); }

/* Vistas */
main { padding-block: 40px 72px; }
.vista { animation: aparecer .5s ease both; }
@keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.revela { animation: revelar .55s ease both; }
@keyframes revelar { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
.ceja { font: 600 var(--t-xs)/1 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--violeta); }
.cab-seccion { display: grid; gap: 12px; margin-bottom: 32px; }
.intro { font-family: var(--f-lectura); font-size: var(--t-l); color: var(--blanco-suave); line-height: 1.5; }
.bloque { display: grid; gap: 20px; margin-top: 56px; }
.bloque > h3 { font-size: 1.5rem; }
.nota { font-size: var(--t-xs); color: var(--blanco-suave); }

/* Portada */
.portada { min-height: calc(100vh - 160px); display: grid; align-content: center; justify-items: center; text-align: center; gap: 28px; padding-block: 24px; }
.portada h1 { font-size: var(--t-xxl); font-weight: 400; letter-spacing: -.01em; }
.portada .sub { font: 600 var(--t-xs)/1.4 var(--f-ui); letter-spacing: .18em; text-transform: uppercase; color: var(--violeta); }
.portada .intro { max-width: 46ch; font-style: normal; color: var(--blanco); opacity: .88; }
.portada .acciones { display: grid; gap: 6px; justify-items: center; }

/* Sobre */
.sobre { position: relative; width: min(260px, 70vw); aspect-ratio: 1.55; max-width: 100%; perspective: 900px; }
.sobre .carta-asoma {
  position: absolute; left: 8%; right: 8%; top: 8%; height: 80%; box-sizing: border-box; background: var(--papel); border-radius: 4px;
  transition: transform .7s cubic-bezier(.3,.7,.2,1); box-shadow: 0 2px 8px rgba(0,0,0,.25);
  background-image: repeating-linear-gradient(to bottom, transparent 0 14px, rgba(21,17,26,.12) 14px 15px); background-position: 0 18px; background-clip: content-box; padding: 14% 12% 0;
}
.sobre .cuerpo { position: absolute; inset: 0; border-radius: 6px; background: linear-gradient(160deg, #5b36a8, #3a2270); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.sobre .cuerpo::after { content: ""; position: absolute; inset: 0; border-radius: 6px; background: linear-gradient(to top right, rgba(0,0,0,.18) 50%, transparent 50%) left / 50% 100% no-repeat, linear-gradient(to top left, rgba(0,0,0,.18) 50%, transparent 50%) right / 50% 100% no-repeat; }
.sobre .solapa {
  position: absolute; left: 0; right: 0; top: 0; height: 58%; transform-origin: top; z-index: 2;
  background: linear-gradient(180deg, #6d44c4, #4b2a8a); clip-path: polygon(0 0, 100% 0, 50% 100%);
  transition: transform .7s cubic-bezier(.3,.7,.2,1);
}
.sobre .sello {
  position: absolute; left: 50%; top: 58%; width: 34px; height: 34px; margin: -17px 0 0 -17px; z-index: 3; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffffff, #d8cfe8 60%, #b3a5cc); box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: opacity .3s;
}
.sobre.abierto .solapa { transform: rotateX(180deg); z-index: 0; }
.sobre.abierto .sello { opacity: 0; }
.sobre.abierto .carta-asoma { transform: translateY(-38%); }
.sobre.abierto .cuerpo { z-index: 1; }
.sobre.abierto .carta-asoma { z-index: 0; }

/* Juego */
.juego { display: grid; gap: 28px; }
.etapas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; list-style: none; padding: 0; margin: 0; }
.etapas button, .etapas span.etapa {
  display: grid; gap: 6px; width: 100%; text-align: left; padding: 8px 0 0; background: none; border: 0; color: var(--blanco-suave);
  font: 500 var(--t-xs)/1.3 var(--f-ui); letter-spacing: .03em; border-top: 3px solid var(--linea); cursor: pointer; min-height: 44px;
}
.etapas span.etapa { cursor: default; opacity: .55; }
.etapas .hecha { border-top-color: var(--lavanda); color: var(--blanco); }
.etapas .actual { border-top-color: var(--violeta); color: var(--blanco); }
.pista {
  background: var(--negro-2); border: 1px solid var(--linea); border-radius: var(--radio);
  padding: clamp(22px, 5vw, 40px); display: grid; gap: 20px;
}
.pista h3 { font-size: clamp(1.4rem, 4vw, 1.9rem); }
.pista .texto { font-family: var(--f-lectura); font-size: 1.2rem; line-height: 1.6; }
.opciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.opcion {
  min-height: 56px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--linea); background: var(--negro-3);
  color: var(--blanco); font: 400 1.15rem/1.3 var(--f-lectura); cursor: pointer; text-align: center;
  transition: border-color .2s, background .2s;
}
.opcion:hover { border-color: var(--lavanda); }
.opcion[aria-pressed="true"] { border-color: var(--lavanda); background: rgba(195,168,255,.12); }
.ayuda { border-left: 2px solid var(--violeta); padding: 4px 0 4px 16px; color: var(--blanco-suave); font-family: var(--f-lectura); }
.revelado { background: rgba(124,77,219,.25); border: 1px solid rgba(195,168,255,.25); border-radius: 12px; padding: 18px 20px; display: grid; gap: 10px; font-family: var(--f-lectura); font-size: 1.1rem; }
.aviso-editor { font-size: var(--t-xs); color: var(--violeta); border: 1px dashed rgba(157,123,255,.5); border-radius: 10px; padding: 10px 14px; }
.campo { display: grid; gap: 8px; }
.campo label { font-size: var(--t-s); color: var(--blanco-suave); }
textarea {
  width: 100%; box-sizing: border-box; min-height: 110px; resize: vertical; padding: 14px; border-radius: 12px;
  border: 1px solid var(--linea); background: var(--negro); color: var(--blanco); font: 400 1.05rem/1.5 var(--f-lectura);
}
.desbloqueo {
  display: grid; gap: 14px; padding: 22px; border-radius: var(--radio);
  background: linear-gradient(135deg, rgba(157,123,255,.14), rgba(124,77,219,.25)); border: 1px solid rgba(157,123,255,.4);
}
.desbloqueo .llave { display: inline-flex; align-items: center; gap: 10px; font: 600 var(--t-xs)/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--violeta); }
.desbloqueo .llave::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--violeta); box-shadow: 0 0 0 4px rgba(157,123,255,.2); }
.desbloqueo.revela .llave::before { animation: latido 1.2s ease 2; }
@keyframes latido { 50% { box-shadow: 0 0 0 9px rgba(157,123,255,0); } }
.desbloqueo strong { font-family: var(--f-display); font-weight: 500; font-size: 1.35rem; }
/* Juego: cámara */
.vertical { --ratio: 4 / 5; }
.vertical .visor, .vertical .copia-papel, .vertical .papel-foto { width: 100%; max-width: 420px; justify-self: center; box-sizing: border-box; }
.escena img { object-position: 50% 12%; }
.escena { width: 100%; height: 100%; }
.escena svg, .escena img { width: 100%; height: 100%; display: block; object-fit: cover; }
.camara { display: grid; gap: 18px; }
.visor { position: relative; aspect-ratio: var(--ratio); max-width: 100%; border-radius: 10px; overflow: hidden; background: #000; border: 10px solid #0b0809; box-shadow: 0 0 0 1px rgba(245,243,247,.12); }
.visor .escena { transition: filter .25s; }
.reticula {
  position: absolute; inset: 0; pointer-events: none; --ret: rgba(255,255,255,.3);
  background-image: linear-gradient(var(--ret), var(--ret)), linear-gradient(var(--ret), var(--ret)), linear-gradient(var(--ret), var(--ret)), linear-gradient(var(--ret), var(--ret));
  background-size: 1px 100%, 1px 100%, 100% 1px, 100% 1px; background-repeat: no-repeat;
  background-position: 33.33% 0, 66.66% 0, 0 33.33%, 0 66.66%;
}
.reticula::after { content: ""; position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border: 1px solid rgba(255,255,255,.55); border-radius: 50%; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.visor.dispara .flash { animation: flash .8s ease-out; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
.fotometro { display: grid; gap: 8px; }
.fotometro-escala { position: relative; display: flex; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--linea); font: 500 var(--t-xs)/1 var(--f-ui); color: var(--blanco-suave); font-variant-numeric: tabular-nums; }
.fotometro-escala span { width: 2.2em; text-align: center; }
.fotometro-escala i { position: absolute; top: -7px; width: 4px; height: 16px; margin-left: -2px; background: var(--violeta); border-radius: 2px; transition: left .3s; }
.fotometro-texto { font-size: var(--t-s); }
.diales { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.dial { display: grid; gap: 8px; background: var(--negro-3); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 12px; }
.dial-et { font: 600 var(--t-xs)/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--violeta); }
.dial-ctrl { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.paso { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--linea); background: var(--negro); color: var(--blanco); font: 500 1.3rem/1 var(--f-ui); cursor: pointer; }
.paso:hover { border-color: var(--lavanda); }
.paso[aria-disabled="true"] { opacity: .35; cursor: default; }
.dial-val { font: 500 1.15rem/1 var(--f-ui); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; min-height: 44px; accent-color: var(--violeta); }
.aviso-juego { color: var(--lavanda); border-left: 2px solid var(--lavanda); padding: 4px 0 4px 14px; font-size: var(--t-s); }
.ayudas { display: grid; gap: 10px; border-top: 1px solid var(--linea); padding-top: 14px; }
.ayuda b { font: 600 var(--t-s) var(--f-ui); color: var(--violeta); }
.mensaje-etapa { font-family: var(--f-lectura); font-size: 1.15rem; }

/* Juego: cuarto oscuro */
.pista.rojo { background: radial-gradient(120% 70% at 50% 0%, #22163a, #110d17 70%); border-color: rgba(157, 123, 255, .3); }
.luz-seguridad { display: inline-flex; align-items: center; gap: 10px; font: 600 var(--t-xs)/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: #ff9a88; }
.luz-seguridad span { width: 10px; height: 10px; border-radius: 50%; background: #ff4a3a; box-shadow: 0 0 12px 3px rgba(255, 74, 58, .55); }
.lab-fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 24px; align-items: start; }
.negativo-marco { margin: 0; display: grid; gap: 10px; }
.tira-pelicula {
  background-color: #140b09; padding: 20px 10px; border-radius: 4px;
  background-image: repeating-linear-gradient(to right, transparent 0 9px, rgba(230, 210, 190, .4) 9px 17px), repeating-linear-gradient(to right, transparent 0 9px, rgba(230, 210, 190, .4) 9px 17px);
  background-size: 100% 7px, 100% 7px; background-position: 0 6px, 0 calc(100% - 6px); background-repeat: repeat-x;
}
.negativo { position: relative; aspect-ratio: var(--ratio); max-width: 100%; overflow: hidden; transform: scaleX(-1); filter: invert(1) sepia(.55) hue-rotate(-20deg) saturate(1.6) brightness(.95); transition: transform .6s, filter .6s; }
.negativo.derecho { transform: none; }
.negativo.positivo { filter: none; }
.nota-negativo { position: absolute; right: 7%; bottom: 8%; font: 600 clamp(.95rem, 3.4vw, 1.3rem)/1 var(--f-ui); color: #fff; letter-spacing: .03em; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.controles-lab { display: grid; gap: 16px; }
.btn[aria-pressed="true"] { border-color: var(--violeta); background: rgba(157, 123, 255, .16); }
.tira-prueba-marco { margin: 0; display: grid; gap: 8px; }
.tira-prueba { display: grid; grid-template-columns: repeat(4, 1fr); aspect-ratio: var(--ratio); max-width: 100%; border: 6px solid #f7f6f9; background: #f7f6f9; }
.banda { position: relative; overflow: hidden; }
.banda .escena { position: absolute; top: 0; height: 100%; }
.banda + .banda { border-left: 1px solid rgba(0, 0, 0, .25); }
.banda-et { position: absolute; left: 4px; bottom: 4px; font: 600 var(--t-xs)/1 var(--f-ui); color: #fff; background: rgba(0, 0, 0, .6); padding: 3px 5px; border-radius: 4px; }
.copia-papel, .papel-foto { margin: 0; width: 100%; max-width: 340px; box-sizing: border-box; background: #f7f6f9; padding: 10px 10px 14px; box-shadow: 0 12px 26px -10px rgba(0, 0, 0, .7); display: grid; gap: 8px; }
.copia-papel .escena, .papel-foto .escena { height: auto; aspect-ratio: var(--ratio); overflow: hidden; }
.papel-foto { justify-self: center; }
.papel-blanco { aspect-ratio: var(--ratio); max-width: 100%; background: #ffffff; }
.revelando { animation: revelado 3s ease-out both; }
@keyframes revelado { 0% { filter: brightness(2.6) contrast(.25) saturate(0); } 60% { filter: brightness(1.3) contrast(.8) saturate(.6); } 100% { filter: none; } }
.cubetas-juego { display: grid; gap: 18px; }
.cubetas { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); gap: 10px; }
.cubeta {
  width: 100%; display: grid; gap: 6px; justify-items: start; min-height: 84px; padding: 12px 14px; border-radius: 10px;
  border: 2px dashed rgba(195, 168, 255, .35); background: rgba(0, 0, 0, .25); color: var(--blanco); text-align: left; cursor: pointer; font: 500 var(--t-s)/1.3 var(--f-ui);
}

/* ---------- utilidades de interfaz ---------- */
function h(tag, attrs, ...hijos) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const c of hijos.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
// Convierte "[MARCADOR]" en texto resaltado como editable.
function t(texto) {
  const frag = document.createDocumentFragment();
  String(texto).split(/(\[[^\]]+\])/g).forEach(parte => {
    if (!parte) return;
    if (/^\[[^\]]+\]$/.test(parte)) frag.append(h("span", { class: "ph", title: "Texto de ejemplo: edítalo en el código" }, parte));
    else frag.append(parte);
  });
  return frag;
}
const tieneMarcador = v => /\[[^\]]+\]/.test(String(v || ""));
const fresco = clave => S.recien.has(clave) ? " revela" : "";
const valorOPorDefinir = v => vacio(v) ? h("span", { class: "pordefinir" }, "Por definir juntos") : t(v);
const enlaceSeguro = url => /^https:\/\/[^\s]+$/i.test(String(url || "").trim());

function Foto({ src, alt, clase }) {
  if (vacio(src)) return null;
  const img = h("img", { src, alt: alt || "", loading: "lazy", class: clase });
  img.addEventListener("error", () => img.remove()); // si la foto no carga, desaparece sin dejar un hueco roto
  return img;
}

function AccessibleButton({ id, texto, variante = "", onClick, extra = {} }) {
  return h("button", Object.assign({ type: "button", id, class: ("btn " + variante).trim(), onClick }, extra), texto);
}

/* ---------- acciones ---------- */
function render() {
  const previo = document.activeElement && document.activeElement.id;
  const cambioVista = S.vista !== ultimaVista;
  app.replaceChildren(ExperienceApp());
  if (cambioVista) {
    window.scrollTo({ top: 0, behavior: "auto" });
    const cab = app.querySelector("[data-foco]");
    if (cab) cab.focus({ preventScroll: true });
  } else if (S.foco && document.getElementById(S.foco)) {
    document.getElementById(S.foco).focus({ preventScroll: false });
  } else if (previo && document.getElementById(previo)) {
    document.getElementById(previo).focus({ preventScroll: true });
  }
  if (S.ancla) {
    const destino = document.getElementById(S.ancla);
    if (destino) { destino.scrollIntoView({ behavior: sinMovimiento() ? "auto" : "smooth", block: "start" }); destino.focus({ preventScroll: true }); }
    S.ancla = null;
  }
  if (S.anuncio) {
    const msg = S.anuncio;
    anuncios.textContent = "";
    setTimeout(() => { anuncios.textContent = msg; }, 60);
    S.anuncio = "";
  }
  S.foco = null;
  S.recien.clear();
  ultimaVista = S.vista;
  ultimoObjeto = S.objeto;
}
function irA(vista, ancla) {
  if (vista !== "portada" && !disponible(vista)) return;
  S.vista = vista; S.saltarAbierto = false; S.avisoBloqueo = ""; S.confirmarReinicio = false; S.hablemos = false;
  if (ancla) S.ancla = ancla;
  render();
}
function verTodo() {
  CONTENIDOS.forEach(id => S.desbloqueadas.add(id));
  S.anuncio = "Todas las secciones están abiertas.";
  irA("carta");
}
function completarEtapa(i) {
  const nuevas = DESBLOQUEOS[i].filter(id => !S.desbloqueadas.has(id));
  DESBLOQUEOS[i].forEach(id => S.desbloqueadas.add(id));
  S.hechas[i] = true;
  S.recien.add("desbloqueo-" + i);
  S.anuncio = nuevas.length ? "Se abrió: " + nuevas.map(tituloDe).join(" y ") + "." : "Pista completada.";
  S.foco = "desbloqueo-" + i;
  render();
}
function siguienteDesde(id) {
  if (!juegoCompleto() && CONTENIDOS.some(c => !S.desbloqueadas.has(c))) return "pistas";
  const i = CONTENIDOS.indexOf(id);
  return CONTENIDOS[i + 1] || null;
}

}

function pasosExposicion(c) {   // > 0: falta luz · < 0: sobra luz
  const N = CAM.f[c.f], V = CAM.v[c.v], I = CAM.iso[c.iso];
  return Math.log2(N * N * V) - Math.log2(I / 100) - CAM.evEscena;
}
const exposicionOk = c => Math.abs(pasosExposicion(c)) <= 0.4;
const focoOk = c => Math.abs(c.foco - CAM.focoObjetivo) <= CAM.focoMargen;
function filtroVisor(c) {
  const d = Math.max(-4, Math.min(4, pasosExposicion(c)));
  const brillo = Math.max(.12, Math.min(3.2, Math.pow(2, -d * .45)));
  const desenfoque = focoOk(c) ? 0 : Math.min(9, Math.abs(c.foco - CAM.focoObjetivo) / 5);
  const contraste = d < -0.4 ? Math.max(.45, 1 + d * .13) : 1;
  return `brightness(${brillo.toFixed(2)}) contrast(${contraste.toFixed(2)}) blur(${desenfoque.toFixed(1)}px)`;
}
function lecturaFotometro(c) {
  const d = pasosExposicion(c);
  if (Math.abs(d) <= 0.4) return "exposición correcta";
  const n = Math.max(1, Math.round(Math.abs(d)));
  const pasos = n === 1 ? "1 paso" : n + " pasos";
  return d > 0 ? `subexpuesta, faltan ${pasos} de luz` : `sobreexpuesta, sobran ${pasos} de luz`;
}
const textoFoco = c => focoOk(c) ? "Enfocada: la imagen está nítida." : (c.foco < CAM.focoObjetivo ? "Desenfocada: sigue girando el anillo hacia la derecha." : "Desenfocada: te pasaste, gíralo un poco hacia la izquierda.");
const descripcionVisor = c => `Visor de la cámara: ${lecturaFotometro(c)}, ${focoOk(c) ? "enfocada" : "desenfocada"}.`;
const posAguja = d => (Math.max(-3, Math.min(3, -d)) + 3) / 6;
function actualizarVisor() {
  const c = S.cam;
  const img = document.getElementById("visor-img"); if (img) img.style.filter = filtroVisor(c);
  const v = document.getElementById("visor"); if (v) v.setAttribute("aria-label", descripcionVisor(c));
  const f = document.getElementById("foco-estado"); if (f) f.textContent = textoFoco(c);
}
function sonidoObturador() {
  if (!S.sonido) return;
  try {
    const ctx = sonidoObturador.ctx || (sonidoObturador.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * .12), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) { const x = i / d.length; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, 2) * ((x < .07 || (x > .5 && x < .58)) ? 1 : .2); }
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); g.gain.value = .3;
    src.connect(g); g.connect(ctx.destination); src.start();
  } catch (e) { /* sin sonido: el juego sigue igual */ }
}

function filtroCopia(segundos) {
  const d = (tiempoObjetivo() - segundos) / 4;   // > 0: le faltó tiempo, sale clara

}

function Ilustracion(nombre, descripcion) {
  const crear = ESCENAS[nombre];
  if (!crear) return null;
  const el = h("div", { class: "ilustracion", role: "img", "aria-label": descripcion || "Ilustración del recuerdo" });
  el.innerHTML = `<svg viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${DEFS_ILUS}${crear()}</svg>`;
  return el;
}

function MemoryGallery() {
  return h("div", { class: "bloque", role: "region", "aria-labelledby": "recuerdos" },
    h("h3", { id: "recuerdos", tabindex: "-1" }, "Recuerdos que quiero conservar"),
    h("div", { class: "recuerdos" }, CONTENIDO.recuerdos.map(r => {
      const visual = Foto({ src: r.foto, alt: r.textoAlternativo }) || (vacio(r.ilustracion) ? null : Ilustracion(r.ilustracion, r.textoAlternativo));
      return h("article", { class: "recuerdo" },
        visual || h("div", { class: "sin-foto" }, h("div", null, t(r.titulo))),
        vacio(r.fecha) ? null : h("p", { class: "fecha" }, r.fecha),
        visual ? h("h4", null, t(r.titulo)) : null,
        h("p", null, t(r.relato)),
        vacio(r.significado) ? null : h("p", { class: "significa" }, t(r.significado))
      );
    }))
  );
}

function MapaMundi() {
  const m = CONTENIDO.mapa;
  const lugares = (m.lugares || []).filter(l => Number.isFinite(l.lat) && Number.isFinite(l.lon));
  const xy = l => [+(l.lon + 180).toFixed(2), +(90 - l.lat).toFixed(2)];
  const conocidos = lugares.filter(l => l.estado === "conocido");
  const reticula = [30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330].map(x => `<line x1="${x}" y1="8" x2="${x}" y2="154"/>`).join("")
    + [30, 60, 90, 120, 150].map(y => `<line x1="0" y1="${y}" x2="360" y2="${y}"/>`).join("");
  const ruta = conocidos.length > 1 ? `<polyline class="mapa-ruta" points="${conocidos.map(l => xy(l).join(",")).join(" ")}"/>` : "";
  // Si dos lugares quedan muy cerca, el pin se aparta y una línea lo une a su punto real.
  const puestos = [], guias = [];
  const pines = lugares.map((l, k) => {
    const [px, py] = xy(l);
    let x = px, y = py, n = 0;
    while (puestos.some(([qx, qy]) => Math.hypot(qx - x, qy - y) < 9) && n < 12) {
      const ang = (n * 60 - 90) * Math.PI / 180, dist = 11 + Math.floor(n / 6) * 9;
      x = +(px + dist * Math.cos(ang)).toFixed(2); y = +(py + dist * Math.sin(ang)).toFixed(2); n++;

    const hecho = l.estado === "conocido";
    const guia = (x !== px || y !== py) ? `<line x1="${px}" y1="${py}" x2="${x}" y2="${y}" stroke="#c3a8ff" stroke-width=".5"/><circle cx="${px}" cy="${py}" r="1" fill="#c3a8ff"/>` : "";

<circle r="4.2" fill="${hecho ? "#c3a8ff" : "#17121f"}" stroke="${hecho ? "#ffffff" : "#c3a8ff"}" stroke-width=".9" ${hecho ? "" : 'stroke-dasharray="1.6 1.2"'}/>
<text y="1.9" text-anchor="middle" font-size="5" font-weight="700" fill="${hecho ? "#17121f" : "#c3a8ff"}">${k + 1}</text></g>`;
  }).join("");

<rect x="0" y="8" width="360" height="146" fill="#120d1b"/>
<g stroke="#2a2140" stroke-width=".4">${reticula}</g>
<path d="${TIERRA}" fill="#2e2448" stroke="#5b4b74" stroke-width=".35" stroke-linejoin="round"/>
${ruta}${guias.join("")}${pines}</svg>`;

      h("h4", null, titulo),

    h("h3", { id: "t-mapa" }, m.titulo),
    h("p", { class: "intro", style: "font-size:1.1rem" }, t(m.intro)),
    h("figure", { class: "mapa" },
      h("div", { role: "img", "aria-label": `Mapa del mundo con ${conocidos.length} lugares que ya conocimos y ${lugares.length - conocidos.length} que queremos conocer.` }, dibujo),
      h("figcaption", { class: "mapa-leyenda" },
        h("span", null, h("i", { class: "ley ley-si", "aria-hidden": "true" }), "Ya los conocimos juntos"),
        h("span", null, h("i", { class: "ley ley-no", "aria-hidden": "true" }), "Queremos conocerlos"))),
    h("div", { class: "mapa-listas" }, lista("conocido", "Ya los conocimos"), lista("pendiente", "Queremos conocer"))
  );
}

function WorldSection() {
  return h("section", null,
    CabeceraSeccion({ ceja: "Mi mundo", titulo: tituloDe("mundo") }),
    InvitationCard(),
    FuturePlans(),
    MapaMundi(),
    SeguirDescubriendo("mundo")
  );
}

function CommitmentsSection() {
  const c = CONTENIDO.compromisos;
  return h("section", null,
    CabeceraSeccion({ ceja: "Compromisos", titulo: tituloDe("construir"), intro: c.intro }),
    h("div", { class: "rejilla" }, c.lista.map(k =>
      h("article", { class: "tarjeta compromiso" },
        h("h3", { class: "tema" }, k.tema),
        h("dl", null,
          [["Lo que quiero hacer", k.quiero], ["Cómo puedo llevarlo a la práctica", k.practica], ["Un primer paso pequeño", k.paso], ["Cómo sabré que estoy siendo coherente", k.coherencia]]
            .map(([dt, dd]) => h("div", null, h("dt", null, dt), h("dd", null, t(dd))))
        )
      )
    )),
    SeguirDescubriendo("construir")
  );
}

function FinalMessage() {
  const c = CONTENIDO.cierre;
  return h("section", { class: "cierre", "aria-labelledby": "t-cierre" },
    h("p", { class: "ceja" }, "Cierre"),
    h("h2", { id: "t-cierre", class: "central", tabindex: "-1", "data-foco": true }, c.central),
    h("div", { class: "linea", "aria-hidden": "true" }),
    h("div", { class: "mensaje lectura" }, c.mensaje.map(p => h("p", null, t(p)))),
    h("p", { class: "final" }, t(c.final)),
    h("div", { class: "acciones" },
      AccessibleButton({ id: "fin-carta", texto: "Volver a la carta", onClick: () => irA("carta") }),
      AccessibleButton({ id: "fin-recuerdos", texto: "Ver los recuerdos", onClick: () => irA("tu", "recuerdos") }),
      AccessibleButton({ id: "fin-invitacion", texto: "Volver a la invitación", onClick: () => irA("mundo") })
    ),
    h("div", { class: "reinicio" },
      S.confirmarReinicio
        ? [h("p", { id: "reinicio-texto", tabindex: "-1" }, "Se cerrarán las secciones y el juego empezará desde la portada. Los textos no cambian."),
           h("div", { class: "fila", style: "justify-content:center" },
             AccessibleButton({ id: "reinicio-si", texto: "Reiniciar el recorrido", onClick: () => { S = estadoInicial(); S.anuncio = "Recorrido reiniciado."; ultimaVista = null; render(); } }),
             h("button", { type: "button", id: "reinicio-no", class: "enlace", onClick: () => { S.confirmarReinicio = false; S.foco = "reiniciar"; render(); } }, "Cancelar"))]
        : h("button", { type: "button", id: "reiniciar", class: "enlace", onClick: () => { S.confirmarReinicio = true; S.foco = "reinicio-texto"; render(); } }, "Volver a empezar el juego")
    )
  );
}

render();
</script>

</body></html>
